services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealflow
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://dealflow:dealflow@db:5432/dealflow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  postgres_data:
